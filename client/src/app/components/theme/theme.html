<button type="button" mat-icon-button class="theme-toggle"
    [attr.aria-label]="theme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'" (click)="toggleTheme()">
    <mat-icon>
        @if (theme() === 'light') {
            dark_mode
        } @else {
            light_mode
        }
    </mat-icon>
</button>
